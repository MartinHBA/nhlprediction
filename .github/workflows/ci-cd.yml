name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Serialize complete runs on each ref so an older build cannot deploy after a newer one.
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

env:
  AZURE_RESOURCE_GROUP: nhlprediction
  AZURE_FUNCTION_APP: nhlpredict-txocp2arkmldw
  AZURE_FUNCTION_URL: https://nhlpredict-txocp2arkmldw.azurewebsites.net
  AZURE_STATIC_WEB_APP: nhl-analyzer-online
  AZURE_WEBSITE_URL: https://www.nhlanalyzer.online
  # Public deployment identifiers; authentication uses short-lived GitHub OIDC tokens.
  AZURE_CLIENT_ID: ddc6d4d2-c777-4da8-8bcd-59f3ce8860f7
  AZURE_TENANT_ID: fe33f81a-58ed-4a30-9541-906c437a9708
  AZURE_SUBSCRIPTION_ID: f983f1cf-92b9-42d6-b7a2-0c16231e49ea

jobs:
  java:
    name: Java tests and package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '21'
          cache: maven
      - name: Test and build Azure Functions
        run: mvn -B -f backend/pom.xml -DfunctionAppName="$AZURE_FUNCTION_APP" verify
      - name: Package the tested application
        shell: bash
        run: |
          cd "backend/target/azure-functions/$AZURE_FUNCTION_APP"
          test -f host.json
          zip -qr "$GITHUB_WORKSPACE/functions.zip" . -x local.settings.json
      - uses: actions/upload-artifact@v4
        with:
          name: azure-functions
          path: functions.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  frontend:
    name: Frontend tests and package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend test dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts
      - name: Test frontend
        working-directory: frontend
        run: npm test
      - name: Package static website
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/website"
          cp frontend/index.html frontend/i18n.js frontend/app.js frontend/styles.css frontend/staticwebapp.config.json "$RUNNER_TEMP/website/"
          cp -R frontend/assets "$RUNNER_TEMP/website/assets"
          printf 'window.NHL_CONFIG = { apiBase: "%s" };\n' "$AZURE_FUNCTION_URL" > "$RUNNER_TEMP/website/config.js"
          printf '{"commit":"%s","run_id":"%s"}\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > "$RUNNER_TEMP/website/release.json"
      - uses: actions/upload-artifact@v4
        with:
          name: static-website
          path: ${{ runner.temp }}/website/
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to Azure
    needs: [java, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: azure-functions
          path: deployment/backend
      - uses: actions/download-artifact@v4
        with:
          name: static-website
          path: deployment/website
      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy Java Functions
        run: >-
          az functionapp deployment source config-zip
          --resource-group "$AZURE_RESOURCE_GROUP"
          --name "$AZURE_FUNCTION_APP"
          --src deployment/backend/functions.zip
          --only-show-errors --output none
      - name: Verify backend before publishing website
        shell: bash
        run: |
          expected_version=$(node -p 'require("fs").readFileSync("backend/pom.xml","utf8").match(/<artifactId>nhl-functions<\/artifactId><version>([^<]+)<\/version>/)[1]')
          for attempt in $(seq 1 24); do
            if curl --fail --silent --show-error --max-time 20 "$AZURE_FUNCTION_URL/health" -o health.json &&
               node -e 'const h=require("./health.json");process.exit(h.status==="ok"&&h.version===process.argv[1]?0:1)' "$expected_version"; then
              echo "Backend health verified: $expected_version"
              exit 0
            fi
            sleep 10
          done
          echo 'Backend health check failed.' >&2
          exit 1
      - name: Read Static Web Apps deployment credentials
        id: static-site
        shell: bash
        run: |
          token=$(az staticwebapp secrets list --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_STATIC_WEB_APP" --query properties.apiKey --output tsv --only-show-errors)
          test -n "$token"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
          hostname=$(az staticwebapp show --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_STATIC_WEB_APP" --query defaultHostname --output tsv --only-show-errors)
          echo "website_url=https://$hostname" >> "$GITHUB_OUTPUT"
      - name: Publish Azure Static Web App
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.static-site.outputs.token }}
          action: upload
          app_location: deployment/website
          api_location: ''
          output_location: ''
          skip_app_build: true
      - name: Verify published website
        shell: bash
        env:
          DEPLOYED_WEBSITE_URL: ${{ steps.static-site.outputs.website_url }}
        run: |
          for attempt in $(seq 1 24); do
            if curl --fail --silent --show-error --max-time 20 --header 'Cache-Control: no-cache' \
                 "$DEPLOYED_WEBSITE_URL/release.json?commit=$GITHUB_SHA&attempt=$attempt" -o release.json &&
               node -e 'const r=require("./release.json");process.exit(r.commit===process.env.GITHUB_SHA?0:1)'; then
              break
            fi
            echo 'Waiting for the tested release to reach the Static Web Apps edge.'
            sleep 5
          done
          node -e 'const r=require("./release.json");if(r.commit!==process.env.GITHUB_SHA)throw new Error("Published website does not match this commit")'
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error --max-time 20 --header 'Cache-Control: no-cache' \
                 "$DEPLOYED_WEBSITE_URL/?commit=$GITHUB_SHA&attempt=$attempt" -o live-index.html &&
               cmp -s deployment/website/index.html live-index.html; then
              break
            fi
            sleep 5
          done
          cmp deployment/website/index.html live-index.html
          {
            echo '### Azure deployment completed'
            echo "Commit: $GITHUB_SHA"
            echo "Website: $AZURE_WEBSITE_URL"
            echo "Azure hostname: $DEPLOYED_WEBSITE_URL"
            echo "Backend: $AZURE_FUNCTION_URL/health"
          } >> "$GITHUB_STEP_SUMMARY"
