[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nhl-prediction-engine"
version = "1.9.0"
description = "Auditable pre-game NHL betting-market checklist-enforced pregame engine"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "jsonschema>=4.18,<5", "fastapi>=0.110,<1", "uvicorn>=0.27,<1", "python-multipart>=0.0.9,<1"]

[project.optional-dependencies]
dev = ["pytest>=7", "httpx>=0.27,<1"]

[project.scripts]
nhl-predict = "nhl_engine.cli:main"

[tool.setuptools.package-data]
nhl_engine = ["schema.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
